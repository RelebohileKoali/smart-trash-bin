services:
  - type: web
    name: smart-trash-bin
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BIN_API_KEY
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_ADDRESS
        sync: false
